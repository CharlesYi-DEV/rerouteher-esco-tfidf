services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 8

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # Alpine may resolve localhost to IPv6 first, while nginx listens on IPv4.
      # Use the explicit IPv4 loopback so Docker does not mark a healthy web
      # gateway unavailable to Coolify/Traefik.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
