name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements.txt
      - run: python -m compileall -q api scripts
      - run: python -m unittest discover -s tests
      - name: Validate deployment entrypoint and private service ports
        run: |
          sh -n deploy/start-web.sh
          if grep -Eq '^[[:space:]]+ports:' docker-compose.yml; then
            echo "Coolify compose file must not bind Docker host ports"
            exit 1
          fi
      - name: Smoke-test both model paths from parsed CV features
        run: |
          python - <<'PY'
          import re
          import numpy as np
          from api.cv_parser import parse_cv
          from api.masco_matcher import GranularMascoMatcher

          class DummyEncoder:
              def encode(self, texts, **kwargs):
                  vectors = np.ones((len(texts), 384), dtype=float)
                  return vectors / np.linalg.norm(vectors, axis=1, keepdims=True)

          cv = b'WORK EXPERIENCE\nSoftware Engineer\n2022 - Present\nSKILLS\nPython, SQL, software testing'
          parsed = parse_cv('sample.txt', cv)
          matcher = GranularMascoMatcher(encoder=DummyEncoder())
          results = [
              matcher.predict_tfidf(parsed.job_title, parsed.skills, parsed.work_length_years, 3),
              matcher.predict_minilm(parsed.job_title, parsed.skills, parsed.work_length_years, 3),
          ]
          for result in results:
              assert len(result['matches']) == 3, result
              assert all(re.fullmatch(r'\d{6}', item['masco_code']) for item in result['matches']), result
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
