name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements.txt
      - run: python -m compileall -q api scripts
      - run: python -m unittest discover -s tests
      - name: Smoke-test both model paths from parsed CV features
        run: >-
          python -c "from api.cv_parser import parse_cv;
          from api.matcher import TfidfEscoMatcher;
          from api.minilm_matcher import MiniLmEscoMatcher;
          cv=b'WORK EXPERIENCE\nSoftware Engineer\n2022 - Present\nSKILLS\nPython, SQL, software testing';
          parsed=parse_cv('sample.txt',cv);
          tf=TfidfEscoMatcher().predict(parsed.job_title,parsed.skills,parsed.work_length_years,3);
          mini=MiniLmEscoMatcher().predict(parsed.job_title,parsed.skills,parsed.work_length_years,3);
          assert tf['matches'][0]['esco_code']=='2512.4', tf;
          assert mini['matches'][0]['esco_code']=='2512.4', mini"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
