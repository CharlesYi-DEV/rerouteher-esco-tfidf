name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements.txt
      - run: python -m compileall -q api scripts
      - name: Smoke-test typo-tolerant matching
        run: >-
          python -c "from api.matcher import TfidfEscoMatcher;
          result=TfidfEscoMatcher().predict('warehous operatr',['inventory','packing'],1,3);
          assert result['matches'][0]['esco_code']=='9333.8', result"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
